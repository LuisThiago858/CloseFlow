name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade do monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      API_PORT: 3000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:4173
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://closeflow_ci:closeflow_ci_only@localhost:5432/closeflow_ci?schema=public
      DATABASE_URL_TEST: postgresql://closeflow_ci:closeflow_ci_only@localhost:5432/closeflow_ci?schema=public

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: closeflow_ci
          POSTGRES_USER: closeflow_ci
          POSTGRES_PASSWORD: closeflow_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U closeflow_ci -d closeflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências pelo lockfile
        run: pnpm install --frozen-lockfile

      - name: Gerar Prisma Client
        run: pnpm prisma:generate

      - name: Validar schema Prisma
        run: pnpm prisma:validate

      - name: Aplicar migrations versionadas
        run: pnpm db:migrate:deploy

      - name: Verificar estado das migrations
        run: pnpm db:migrate:status

      - name: Verificar formatação
        run: pnpm format:check

      - name: Executar lint
        run: pnpm lint

      - name: Executar typecheck
        run: pnpm typecheck

      - name: Executar testes unitários
        run: pnpm test

      - name: Executar testes de integração
        run: pnpm test:integration

      - name: Gerar builds
        run: pnpm build

      - name: Instalar Chromium para E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Executar testes end-to-end
        run: pnpm test:e2e
